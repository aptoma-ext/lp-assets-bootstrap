text-properties:
  title: Text
  type: object
  properties:
    .text-background--{option}:
      $ref: "#/definitions/colors"
      title: Background color

    .text-background--bigger:
      title: Larger background
      type: boolean

    .text-color--{color}:
      $ref: "#/definitions/colors"
      title: Text color

    .text-effect--{effect}:
      title: Effect
      type: string
      enum:
        - shadow
        - outline
      enumNames:
        - Shadow
        - Outline

text-color:
  title: Text color
  type: object
  properties:
    .text-color--{color}:
      title: Color
      type: string
      enum:
        - black
        - white
      enumNames:
        - Black
        - White
